syntax = "proto3";

option java_multiple_files = true;
option java_package = "billing";

service BillingService {
  rpc CreateBillingAccount (BillingRequest) returns (BillingResponse); //o serviço BillingService vai ter uma chamada para CreateBillingAccount que recebe como parâmetro um BillingRequest de algum cliente
}
//esses números ajudam o gRPC na hora de serializar para pegar e definir os valores de cada atributo (devem ser únicos)
message BillingRequest {
  string patientId = 1;
  string name = 2;
  string email = 3;
}

message BillingResponse {
  string accountId = 1;
  string status = 2;
}